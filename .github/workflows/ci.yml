name: CI

on:
  push:
  pull_request:

jobs:
  micro-proyecto-2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: micro-proyectos/micro-proyecto-2-cloud-ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Lint con ruff
        run: ruff check .
      - name: Pruebas
        run: pytest -q
